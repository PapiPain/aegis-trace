name: AegisTrace Security Audit

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  audit-dead-code:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar dependencias del Monorepo
        run: npm install

      - name: Compilar paquetes de AegisTrace
        run: npm run build

      - name: Ejecutar Auditoría AegisTrace (Cloud o Zero-Server Fallback)
        env:
          AEGIS_API_KEY: ${{ secrets.AEGIS_API_KEY }}
          AEGIS_SECRET: ${{ secrets.AEGIS_SECRET }}
          AEGIS_URL: ${{ secrets.AEGIS_INGESTION_URL }}
        run: |
          if [ -z "$AEGIS_URL" ]; then
            echo "ℹ No se detectó AEGIS_INGESTION_URL remoto. Inicializando telemetría Zero-Server para CI..."
            echo "{}" > .aegis-local.json
            node packages/cli/dist/index.js \
              --dir=apps/test-service/src \
              --local \
              --output=SECURITY_AUDIT.md \
              --format=markdown
          else
            node packages/cli/dist/index.js \
              --dir=apps/test-service/src \
              --output=SECURITY_AUDIT.md \
              --format=markdown
          fi

      - name: Publicar Resumen en Job Summary de GitHub
        if: always()
        run: |
          if [ -f SECURITY_AUDIT.md ]; then
            cat SECURITY_AUDIT.md >> $GITHUB_STEP_SUMMARY
          fi

      - name: Publicar Reporte en el Pull Request
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const reportPath = 'SECURITY_AUDIT.md';

            if (!fs.existsSync(reportPath)) {
              console.log('No se generó el archivo de reporte SECURITY_AUDIT.md.');
              return;
            }

            const body = fs.readFileSync(reportPath, 'utf8');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const botComment = comments.find(comment => 
              comment.body && comment.body.includes('AegisTrace — Reporte de Auditoría de Código Muerto')
            );

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: body
              });
              console.log('Comentario previo actualizado exitosamente en el PR.');
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: body
              });
              console.log('Nuevo comentario de auditoría creado en el PR.');
            }