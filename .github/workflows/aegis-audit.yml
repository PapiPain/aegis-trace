name: AegisTrace Security Audit

on:
  pull_request:
    branches: [ main ]

jobs:
  audit-dead-code:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Instalar dependencias
        run: npm ci

      - name: Compilar paquetes
        run: |
          npm run build --workspace=@aegistrace/node-sdk
          npm run build --workspace=@aegistrace/cli

      - name: Ejecutar Auditoría AegisTrace
        env:
          AEGIS_API_KEY: ${{ secrets.AEGIS_API_KEY }}
          AEGIS_SECRET: ${{ secrets.AEGIS_SECRET }}
          AEGIS_URL: ${{ secrets.AEGIS_INGESTION_URL }}
        run: |
          npx aegis-trace --dir=apps/test-service/src --output=SECURITY_AUDIT.md

      - name: Publicar Reporte en el Pull Request
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const reportPath = 'SECURITY_AUDIT.md';

            if (fs.existsSync(reportPath)) {
              const body = fs.readFileSync(reportPath, 'utf8');
              
              const { data: comments } = await github.rest.issues.listComments({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
              });

              const botComment = comments.find(comment => 
                comment.body.includes('AegisTrace — Reporte de Auditoría de Código Muerto')
              );

              if (botComment) {
                await github.rest.issues.updateComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: botComment.id,
                  body: body
                });
              } else {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: context.issue.number,
                  body: body
                });
              }
            }