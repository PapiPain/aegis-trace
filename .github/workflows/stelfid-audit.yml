name: Maiestor Stelfid — RC Certification & Multi-OS CI

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  stelfid-rc-verification:
    name: Verify SDK, CLI, VSCode Extension & Safety (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node-version: [20.x]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install Workspace Dependencies
        run: npm install --ignore-scripts

      - name: Build Workspaces (Node SDK + CLI + VS Code Extension)
        run: npm run build

      - name: Run Suite 1 — Transport, ACID Idempotency & Durable Queue
        run: npm run test:readiness

      - name: Run Suite 2 — OWASP API9/API2 Semantics & 4-Format Hash Integrity
        run: npm run test:audit-semantics

      - name: Run Suite 3 — Pre-Production 5-Point Certification (Express, Low-Freq, 3-PID Crash, Rollback)
        run: npm run test:rc-certification

      - name: Verify Release Gate & NPM Tarball Packaging (Dry-Run)
        run: |
          npm pack --workspace=@m_stelfid/node-sdk --dry-run
          npm pack --workspace=@m_stelfid/cli --dry-run
